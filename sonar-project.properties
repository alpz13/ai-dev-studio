# SonarCloud project configuration.
sonar.organization=alpz13
sonar.projectKey=alpz13_ai-dev-studio

sonar.sources=src
sonar.exclusions=**/__tests__/**,dist/**,node_modules/**

# Test coverage: npm run test:coverage (run in CI before the scan) emits
# this via the "lcov" reporter added to vitest.config.ts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
